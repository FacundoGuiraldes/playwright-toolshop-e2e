name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Type-check
      run: npx tsc --noEmit

  e2e:
    # practicesoftwaretesting.com is a third-party demo site behind Cloudflare bot
    # protection, which can block traffic from shared CI IP ranges. This job is
    # informational, not a merge-blocking gate, so an external block doesn't fail the pipeline.
    continue-on-error: true
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npm run run-test -- --project=chromium
      env:
        CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
        CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
        CUSTOMER2_EMAIL: ${{ secrets.CUSTOMER2_EMAIL }}
        CUSTOMER2_PASSWORD: ${{ secrets.CUSTOMER2_PASSWORD }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    - name: Generate Allure report
      if: ${{ !cancelled() }}
      run: npm run generate-report
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-results
        path: test-results/
        retention-days: 30

  deploy-report:
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download allure-report artifact
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
